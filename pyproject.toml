[project]
name = "astrochat"
version = "0.1.0"
description = "a simple chatbot for Zulip"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "zulip>=0.9.1",
    "zulip-bots>=0.9.1",
    "zulip-botserver>=0.9.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]

[tool.ruff]
line-length = 100